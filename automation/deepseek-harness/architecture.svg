<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="'Noto Sans SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .zone{fill:#fff;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 5}
      .box{stroke-width:1.5;rx:11;ry:11}
      .title{font-size:15px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#334155}
      .tiny{font-size:11px;fill:#64748b}
      .flow{fill:none;stroke:#475569;stroke-width:1.7;marker-end:url(#arrow)}
      .data{fill:none;stroke:#2563eb;stroke-width:1.7;marker-end:url(#arrow-blue)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1100" height="760" fill="url(#page)"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">DeepSeek Harness 运行时与插件架构</text>
  <text x="550" y="61" text-anchor="middle" font-size="12.5" fill="#64748b">已验证部署：Rocky Linux 9.7 · Node.js 22.22.2 · dsh 0.1.0-rc.6 · Web 127.0.0.1:3080</text>

  <rect class="box" x="35" y="105" width="170" height="88" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="title" x="120" y="136" text-anchor="middle">浏览器 Web UI</text>
  <text class="sub" x="120" y="158" text-anchor="middle">设置 · 会话 · 工作区</text>
  <text class="tiny" x="120" y="177" text-anchor="middle">HTTP / RPC / 流式事件</text>

  <rect class="zone" x="245" y="84" width="820" height="568" rx="18"/>
  <text x="266" y="108" font-size="12" font-weight="700" fill="#475569">dsh web 进程（Cordis 插件树）</text>

  <rect class="box" x="285" y="126" width="210" height="92" fill="#ecfeff" stroke="#06b6d4"/>
  <text class="title" x="390" y="156" text-anchor="middle">Web Host 层</text>
  <text class="sub" x="390" y="178" text-anchor="middle">静态前端 · API Gateway</text>
  <text class="tiny" x="390" y="198" text-anchor="middle">WebServer / Remotes / Client</text>

  <rect class="box" x="540" y="126" width="230" height="92" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text class="title" x="655" y="156" text-anchor="middle">Profile 组装层</text>
  <text class="sub" x="655" y="178" text-anchor="middle">dsh-base + dsh-web-app</text>
  <text class="tiny" x="655" y="198" text-anchor="middle">bundle → profile → home → --patch</text>

  <rect class="box" x="815" y="126" width="210" height="92" fill="#fff7ed" stroke="#f97316"/>
  <text class="title" x="920" y="156" text-anchor="middle">设置与凭据</text>
  <text class="sub" x="920" y="178" text-anchor="middle">settings.yaml · 引用</text>
  <text class="tiny" x="920" y="198" text-anchor="middle">.credentials.yaml（仅属主）</text>

  <rect class="box" x="285" y="272" width="250" height="128" fill="#eef2ff" stroke="#6366f1"/>
  <text class="title" x="410" y="302" text-anchor="middle">Agent Loop</text>
  <text class="sub" x="410" y="326" text-anchor="middle">领取输入 → 组装提示词</text>
  <text class="sub" x="410" y="348" text-anchor="middle">模型流式响应 → 工具调用</text>
  <text class="tiny" x="410" y="374" text-anchor="middle">turn / step / approval / plan / goal</text>

  <rect class="box" x="570" y="272" width="210" height="128" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="title" x="675" y="302" text-anchor="middle">能力 Seam</text>
  <text class="sub" x="675" y="326" text-anchor="middle">工具注册 · 文件系统</text>
  <text class="sub" x="675" y="348" text-anchor="middle">Shell · 沙箱 · 子 Agent</text>
  <text class="tiny" x="675" y="374" text-anchor="middle">服务定义 / 提供方 / 消费方</text>

  <rect class="box" x="815" y="272" width="210" height="128" fill="#fdf4ff" stroke="#d946ef"/>
  <text class="title" x="920" y="302" text-anchor="middle">模型适配器</text>
  <text class="sub" x="920" y="326" text-anchor="middle">DeepSeek 原生</text>
  <text class="sub" x="920" y="348" text-anchor="middle">OpenAI 兼容 / 其他 Provider</text>
  <text class="tiny" x="920" y="374" text-anchor="middle">每次请求重新解析凭据</text>

  <rect class="box" x="285" y="460" width="250" height="112" fill="#f8fafc" stroke="#64748b"/>
  <text class="title" x="410" y="490" text-anchor="middle">持久会话事件流</text>
  <text class="sub" x="410" y="514" text-anchor="middle">SessionEvent JSONL</text>
  <text class="sub" x="410" y="536" text-anchor="middle">回放 · 恢复 · 投影 · 导出</text>
  <text class="tiny" x="410" y="557" text-anchor="middle">$DSH_HOME/sessions</text>

  <rect class="box" x="570" y="460" width="210" height="112" fill="#fffbeb" stroke="#eab308"/>
  <text class="title" x="675" y="490" text-anchor="middle">本地工作区</text>
  <text class="sub" x="675" y="514" text-anchor="middle">/home/devops/sre-handbook</text>
  <text class="sub" x="675" y="536" text-anchor="middle">默认 workspace-write</text>
  <text class="tiny" x="675" y="557" text-anchor="middle">越界操作需审批</text>

  <rect class="box" x="815" y="460" width="210" height="112" fill="#ecfdf5" stroke="#10b981"/>
  <text class="title" x="920" y="490" text-anchor="middle">外部模型服务</text>
  <text class="sub" x="920" y="514" text-anchor="middle">api.deepseek.com / 网关</text>
  <text class="sub" x="920" y="536" text-anchor="middle">HTTPS 出站</text>
  <text class="tiny" x="920" y="557" text-anchor="middle">模型推理与流式返回</text>

  <path class="data" d="M205,149 L283,149"/>
  <text class="tiny" x="243" y="139" text-anchor="middle">请求</text>
  <path class="flow" d="M495,172 L538,172"/>
  <path class="flow" d="M655,218 L655,250 L410,250 L410,270"/>
  <path class="dash" d="M815,172 L772,172"/>
  <path class="flow" d="M535,336 L568,336"/>
  <path class="data" d="M780,336 L813,336"/>
  <path class="data" d="M920,400 L920,458"/>
  <path class="flow" d="M410,400 L410,458"/>
  <path class="flow" d="M675,400 L675,458"/>
  <path class="dash" d="M815,198 C770,235 745,245 704,271"/>

  <rect x="245" y="684" width="820" height="42" rx="9" fill="#0f172a" opacity="0.94"/>
  <text x="655" y="702" text-anchor="middle" font-size="11.5" fill="#e2e8f0">安全边界：Web 默认仅监听回环；浏览器批准受控操作；密钥与普通设置分离；工具访问受 workspace 与 sandbox 策略约束</text>
  <text x="655" y="718" text-anchor="middle" font-size="10.5" fill="#94a3b8">“一切皆插件”：组件通过 Cordis 服务、事件与可逆副作用组合，可由更高优先级 patch 替换</text>
</svg>
