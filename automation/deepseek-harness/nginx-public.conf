# DeepSeek Harness public HTTPS entrypoint.
# The application remains loopback-only at 127.0.0.1:3080.
map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

# The Harness configuration plane is loopback-only. Reject foreign browser
# origins before normalizing the authenticated request to the backend origin.
map $http_origin $dsh_origin_allowed {
    default                         0;
    "https://139.162.62.212:8443"  1;
    ""                              1;
}

server {
    listen      8443 ssl;
    listen [::]:8443 ssl;
    server_name 139.162.62.212;

    ssl_certificate     /etc/pki/tls/certs/deepseek-harness.crt;
    ssl_certificate_key /etc/pki/tls/private/deepseek-harness.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:DSH_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    auth_basic           "DeepSeek Harness - Restricted";
    auth_basic_user_file /etc/nginx/deepseek-harness.htpasswd;

    client_max_body_size 100m;
    access_log /var/log/nginx/deepseek-harness.access.log;
    error_log  /var/log/nginx/deepseek-harness.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        if ($dsh_origin_allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $dsh_connection_upgrade;
        # Basic Auth has already authenticated this request. Harness keeps its
        # settings and credential methods loopback-only, so present the trusted
        # proxy hop as the loopback same-origin authority it actually reaches.
        proxy_set_header Host                 127.0.0.1:3080;
        proxy_set_header Origin               http://127.0.0.1:3080;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host     $http_host;
        proxy_set_header X-Forwarded-Proto    https;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
